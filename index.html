
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Occupancy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 25px;
      color: #172333;
    }

    .dashboard {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 22px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000012;
    }

    .number {
      font-size: 48px;
      font-weight: bold;
      margin: 15px;
    }

    button {
      padding: 12px 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #2463eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1749b5;
    }

    .track {
      height: 15px;
      background: #e0e7ef;
      border-radius: 10px;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 45%;
      background: #22a06b;
      transition: width 0.3s;
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <h1>📚 Library Occupancy</h1>
    <p>Room Capacity Monitoring System</p>

    <div class="card">
      <h3>People Inside</h3>
      <div class="number" id="people">27</div>

      <button onclick="enterLibrary()">Simulate Entry +1</button>
      <button onclick="exitLibrary()">Simulate Exit -1</button>
    </div>

    <div class="card">
      <h3>Maximum Capacity</h3>
      <div class="number" id="capacity">60</div>
      <p id="available">33 spaces remaining</p>
    </div>

    <div class="card">
      <h3>Occupancy Level</h3>
      <h2 id="percent">45%</h2>

      <div class="track">
        <div id="bar"></div>
      </div>

      <p id="status">Space available</p>
    </div>
  </div>

  <script>
    let people = 27;
    const capacity = 100;

    function updateDashboard() {
      const percent = Math.round(people / capacity * 100);

      document.getElementById("people").textContent = people;
      document.getElementById("capacity").textContent = capacity;
      document.getElementById("percent").textContent = percent + "%";

      document.getElementById("bar").style.width =
        Math.min(percent, 100) + "%";

      document.getElementById("available").textContent =
        Math.max(0, capacity - people) + " spaces remaining";

      document.getElementById("status").textContent =
        people >= capacity ? "Library full" :
        percent >= 80 ? "Getting busy" :
        "Space available";

      document.getElementById("bar").style.background =
        people >= capacity ? "#dc4545" :
        percent >= 80 ? "#d99520" :
        "#22a06b";
    }

    function enterLibrary() {
      if (people < capacity) {
        people++;
      }
      updateDashboard();
    }

    function exitLibrary() {
      if (people > 0) {
        people--;
      }
      updateDashboard();
    }

    updateDashboard();
  </script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    // Replace this comment with your actual Firebase config fields
  };

  firebase.initializeApp(firebaseConfig);

  const database = firebase.database();

  database.ref("occupancy/count").on("value", (snapshot) => {
    const count = snapshot.val();
    console.log("Live library occupancy:", count);
  });
</script>
</body>
</html>
